<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HAMI Coffee - Đặt món</title>

<style>
:root{
  --red:#df1f2f;
  --red-dark:#bd1523;
  --cream:#fffaf0;
  --cream-2:#f8efd9;
  --card:#ffffff;
  --text:#3f3b38;
  --muted:#77716b;
  --line:#e8dfd0;
  --green:#7f944d;
  --green-light:#edf3e3;
  --warning:#9b6b22;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at top right, #fff2d7 0, transparent 28%),
    radial-gradient(circle at left center, #fff6e5 0, transparent 25%),
    var(--cream);
}

.hero{
  text-align:center;
  padding:48px 20px 34px;
  background:
    linear-gradient(135deg, rgba(255,255,255,.72), rgba(255,247,230,.9));
  border-bottom:1px solid #eadfcf;
}

.decor{
  font-size:28px;
  letter-spacing:8px;
  margin-bottom:8px;
}

.logo{
  color:var(--red);
  font-size:58px;
  font-weight:900;
  font-style:italic;
  letter-spacing:-3px;
  line-height:1;
}

.sublogo{
  margin-top:16px;
  font-size:17px;
  font-weight:bold;
  letter-spacing:10px;
  color:#4b4742;
}

.tagline{
  margin-top:24px;
  font-size:20px;
  color:#625d57;
}

.wrap{
  width:min(1100px, calc(100% - 28px));
  margin:0 auto;
  padding:28px 0 50px;
}

.section-title{
  display:flex;
  align-items:center;
  gap:12px;
  margin:28px 0 18px;
  font-size:30px;
  font-weight:800;
}

.section-title .star{
  font-size:34px;
}

.menu-grid{
  display:grid;
  grid-template-columns:repeat(2, minmax(0,1fr));
  gap:20px;
}

.drink-card{
  background:rgba(255,255,255,.88);
  border:1px solid var(--line);
  border-radius:26px;
  overflow:hidden;
  box-shadow:0 8px 25px rgba(105,82,45,.08);
  transition:.2s;
}

.drink-card:hover{
  transform:translateY(-3px);
}

.drink-image{
  height:180px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:96px;
  background:
    radial-gradient(circle at center, #fff 0%, #fffaf1 45%, #f5ead5 100%);
  border-bottom:1px solid #f1e8dc;
}

.drink-content{
  padding:20px;
}

.drink-name{
  font-size:25px;
  font-weight:800;
  margin-bottom:12px;
}

.drink-price{
  min-height:27px;
  color:#8d2d2d;
  font-size:18px;
  font-weight:bold;
  margin-bottom:16px;
}

.drink-price.pending{
  color:var(--warning);
}

.select-size{
  width:100%;
  padding:15px 16px;
  border:1px solid #ddd3c4;
  border-radius:16px;
  background:#fff;
  color:#49433d;
  font-size:17px;
  outline:none;
  margin-bottom:16px;
}

.qty-row{
  display:flex;
  align-items:center;
  gap:16px;
}

.qty-btn{
  width:64px;
  height:64px;
  border:0;
  border-radius:50%;
  font-size:35px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}

.minus{
  background:#eef0e8;
  color:#778063;
}

.plus{
  background:var(--green);
  color:white;
}

.qty-number{
  min-width:30px;
  text-align:center;
  font-size:25px;
  font-weight:bold;
}

.order-box{
  margin-top:32px;
  background:rgba(255,255,255,.92);
  border:1px solid var(--line);
  border-radius:28px;
  padding:28px;
  box-shadow:0 8px 25px rgba(105,82,45,.08);
}

.cart-empty{
  color:var(--muted);
  text-align:center;
  padding:20px 0;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:15px 0;
  border-bottom:1px dashed #d9cebd;
}

.cart-item:last-child{
  border-bottom:0;
}

.cart-name{
  font-size:18px;
  font-weight:bold;
}

.cart-detail{
  color:var(--muted);
  margin-top:5px;
}

.cart-price{
  text-align:right;
  font-weight:bold;
  color:#822b2b;
  white-space:nowrap;
}

.cart-pending{
  color:var(--warning);
}

.summary{
  border-top:2px solid #eee5d9;
  margin-top:16px;
  padding-top:20px;
}

.total-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:24px;
  font-weight:800;
}

.total-price{
  color:#a31320;
  font-size:32px;
}

.pending-note{
  display:none;
  margin-top:14px;
  padding:13px 15px;
  border-radius:14px;
  background:#fff6df;
  color:#8a6423;
  font-weight:bold;
}

.customer-box{
  margin-top:28px;
  padding-top:26px;
  border-top:2px solid #eee5d9;
}

.form-title{
  font-size:25px;
  font-weight:800;
  margin-bottom:20px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.field.full{
  grid-column:1/-1;
}

label{
  font-size:18px;
  font-weight:bold;
}

.optional{
  color:#777;
  font-weight:normal;
}

input,
textarea{
  width:100%;
  border:1px solid #ddd3c4;
  background:#fff;
  color:#423d38;
  border-radius:17px;
  padding:16px;
  font-size:18px;
  outline:none;
}

input:focus,
textarea:focus,
.select-size:focus{
  border-color:var(--green);
  box-shadow:0 0 0 3px rgba(127,148,77,.12);
}

textarea{
  min-height:120px;
  resize:vertical;
}

.order-button{
  width:100%;
  border:0;
  margin-top:24px;
  padding:21px;
  border-radius:20px;
  background:linear-gradient(135deg, #ff4b5b, #df1423);
  color:white;
  font-size:27px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 12px 24px rgba(207,25,40,.18);
}

.order-button:disabled{
  opacity:.65;
  cursor:not-allowed;
}

.order-help{
  text-align:center;
  color:#777;
  font-size:17px;
  margin-top:15px;
}

.result{
  display:none;
  margin-top:22px;
  padding:22px;
  border-radius:20px;
  font-size:20px;
  font-weight:bold;
  line-height:1.6;
}

.result.success{
  display:block;
  background:#edf7e9;
  border:1px solid #b9d8b0;
  color:#456c42;
}

.result.error{
  display:block;
  background:#fff0ee;
  border:1px solid #eab6af;
  color:#9b342a;
}

.footer{
  text-align:center;
  padding:28px 15px;
  color:#746e66;
}

@media(max-width:700px){

  .hero{
    padding:36px 15px 28px;
  }

  .logo{
    font-size:52px;
  }

  .sublogo{
    font-size:14px;
    letter-spacing:8px;
  }

  .tagline{
    font-size:17px;
  }

  .menu-grid{
    grid-template-columns:1fr 1fr;
    gap:12px;
  }

  .drink-card{
    border-radius:20px;
  }

  .drink-image{
    height:125px;
    font-size:68px;
  }

  .drink-content{
    padding:15px;
  }

  .drink-name{
    font-size:19px;
  }

  .drink-price{
    font-size:15px;
    min-height:42px;
  }

  .select-size{
    padding:12px;
    font-size:15px;
  }

  .qty-row{
    gap:10px;
  }

  .qty-btn{
    width:48px;
    height:48px;
    font-size:27px;
  }

  .qty-number{
    font-size:20px;
  }

  .section-title{
    font-size:25px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .order-box{
    padding:20px;
    border-radius:22px;
  }

  .total-price{
    font-size:27px;
  }

  .order-button{
    font-size:23px;
  }
}
</style>
</head>

<body>

<header class="hero">
  <div class="decor">🌿 ✦ ♡ ✦ 🌿</div>

  <div class="logo">HAMI</div>

  <div class="sublogo">COFFEE</div>

  <div class="tagline">
    Chọn món ngon · Gửi đơn · Quán nhận ngay
  </div>
</header>


<main class="wrap">

  <h2 class="section-title">
    <span class="star">⭐</span>
    MÓN NỔI BẬT
  </h2>

  <div class="menu-grid" id="menuGrid"></div>


  <section class="order-box">

    <h2 class="section-title" style="margin-top:0">
      🛒 GIỎ HÀNG
    </h2>

    <div id="cart">
      <div class="cart-empty">
        Chưa có món nào được chọn.
      </div>
    </div>

    <div class="summary">

      <div class="total-row">
        <span>Tổng tạm tính</span>
        <span class="total-price" id="total">0đ</span>
      </div>

      <div class="pending-note" id="pendingNote">
        ⚠ Có món chưa báo giá. Quán sẽ báo giá sau.
      </div>

    </div>


    <div class="customer-box">

      <div class="form-title">Thông tin đặt món</div>

      <div class="form-grid">

        <div class="field full">
          <label>Tên của bạn <span style="color:#d71927">*</span></label>
          <input
            type="text"
            id="customerName"
            placeholder="Nhập tên của bạn"
          >
        </div>

        <div class="field">
          <label>
            Số điện thoại
            <span class="optional">(không bắt buộc)</span>
          </label>

          <input
            type="tel"
            id="phone"
            placeholder="Nhập số điện thoại"
          >
        </div>

        <div class="field">
          <label>
            Lớp / Số bàn
            <span class="optional">(không bắt buộc)</span>
          </label>

          <input
            type="text"
            id="className"
            placeholder="Nhập lớp hoặc số bàn"
          >
        </div>

        <div class="field full">
          <label>Ghi chú cho quán</label>

          <textarea
            id="note"
            placeholder="Ví dụ: ít đá, ít ngọt..."
          ></textarea>
        </div>

      </div>


      <button
        class="order-button"
        id="orderButton"
        onclick="submitOrder()"
      >
        🛩 ĐẶT MÓN
      </button>

      <div class="order-help">
        Đơn hàng sẽ được gửi trực tiếp về quán.
      </div>


      <div id="result" class="result"></div>

    </div>

  </section>

</main>


<footer class="footer">
  ❤️ Cảm ơn bạn đã chọn HAMI Coffee
</footer>


<script>

/* =====================================================
   URL APPS SCRIPT
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbyFT9qfJQvIbsrBjJFlzzjcrHL-5BdTkjUVK4FaBbCuCIZmUlAdz8ofztYo5woLlz44/exec";


/* =====================================================
   MENU - GIỮ NGUYÊN TÊN MÓN, SIZE VÀ GIÁ
===================================================== */

const menu = [

  {
    name: "Trà đào",
    icon: "🍑",
    prices: { L: 17000 }
  },

  {
    name: "Trà dâu",
    icon: "🍓",
    prices: { L: 17000 }
  },

  {
    name: "Trà vải",
    icon: "🧋",
    prices: { L: 17000 }
  },

  {
    name: "Soda đào",
    icon: "🥤",
    prices: { L: 17000 }
  },

  {
    name: "Soda dâu",
    icon: "🥤",
    prices: { L: 17000 }
  },

  {
    name: "Soda việt quất",
    icon: "🫐",
    prices: { L: 17000 }
  },

  {
    name: "Soda chanh dây",
    icon: "🍹",
    prices: { L: 17000 }
  },

  {
    name: "Cà phê đen đá",
    icon: "☕",
    prices: { M: 15000 }
  },

  {
    name: "Cà phê sữa",
    icon: "🥛",
    prices: { M: 17000 }
  },

  {
    name: "Cà phê muối",
    icon: "☕",
    prices: { M: 18000 }
  },

  {
    name: "Bạc xỉu",
    icon: "🥛",
    prices: {
      M: 17000,
      L: 20000
    }
  },

  {
    name: "Sữa chua đào",
    icon: "🍑",
    prices: {
      M: 17000,
      L: 22000
    }
  },

  {
    name: "Sữa chua dâu",
    icon: "🍓",
    prices: {
      M: 17000,
      L: 22000
    }
  },

  {
    name: "Sữa chua việt quất",
    icon: "🫐",
    prices: {
      M: 17000,
      L: 22000
    }
  },

  {
    name: "Sữa chua chanh dây",
    icon: "🥭",
    prices: {
      M: 17000,
      L: 22000
    }
  },

  {
    name: "Matcha latte",
    icon: "🍵",
    prices: {
      M: 17000,
      L: 22000
    }
  },

  {
    name: "Khoai môn latte",
    icon: "🧋",
    prices: {
      M: 17000,
      L: 22000
    }
  },

  {
    name: "Cacao latte",
    icon: "🍫",
    prices: {
      M: 17000,
      L: 22000
    }
  },

  {
    name: "Nước chanh",
    icon: "🍋",
    prices: {
      "Tiêu chuẩn": 10000
    }
  },

  {
    name: "Lipton",
    icon: "🍋",
    prices: {
      "Tiêu chuẩn": 10000
    }
  },

  {
    name: "Trà đường",
    icon: "🍵",
    prices: {
      "Tiêu chuẩn": 10000
    }
  },

  {
    name: "Dừa lạnh",
    icon: "🥥",
    prices: {
      "Tiêu chuẩn": 15000
    }
  },

  {
    name: "Nước ngọt các loại",
    icon: "🥤",
    pending: true,
    prices: {
      "Quán báo giá": null
    }
  }

];


/* =====================================================
   GIỎ HÀNG
===================================================== */

let cart = {};


/* =====================================================
   ĐỊNH DẠNG TIỀN
===================================================== */

function money(value){

  if(value === null || value === undefined){
    return "Quán báo giá sau";
  }

  return Number(value).toLocaleString("vi-VN") + "đ";

}


/* =====================================================
   HIỂN THỊ MENU
===================================================== */

function renderMenu(){

  const root = document.getElementById("menuGrid");

  root.innerHTML = "";

  menu.forEach((item, index) => {

    const sizes = Object.keys(item.prices);

    let priceText = "";

    if(item.pending){

      priceText = "Quán báo giá sau";

    } else {

      priceText = sizes
        .map(size => size + ": " + money(item.prices[size]))
        .join(" | ");

    }


    let options = "";

    sizes.forEach(size => {

      const price = item.prices[size];

      if(price === null){

        options += `
          <option value="${size}">
            ${size}
          </option>
        `;

      } else {

        options += `
          <option value="${size}">
            ${size} - ${money(price)}
          </option>
        `;

      }

    });


    root.innerHTML += `

      <article class="drink-card">

        <div class="drink-image">
          ${item.icon}
        </div>

        <div class="drink-content">

          <div class="drink-name">
            ${item.name}
          </div>

          <div class="drink-price ${item.pending ? "pending" : ""}">
            ${priceText}
          </div>

          <select
            class="select-size"
            id="size_${index}"
            onchange="changeSize(${index})"
          >
            ${options}
          </select>

          <div class="qty-row">

            <button
              class="qty-btn minus"
              onclick="changeQty(${index}, -1)"
            >
              −
            </button>

            <div
              class="qty-number"
              id="qty_${index}"
            >
              0
            </div>

            <button
              class="qty-btn plus"
              onclick="changeQty(${index}, 1)"
            >
              +
            </button>

          </div>

        </div>

      </article>

    `;

  });

}


/* =====================================================
   LẤY SIZE HIỆN TẠI
===================================================== */

function getSelectedSize(index){

  const select =
    document.getElementById("size_" + index);

  return select.value;

}


/* =====================================================
   ĐỔI SIZE
===================================================== */

function changeSize(index){

  const item = menu[index];

  Object.keys(cart).forEach(id => {

    if(cart[id].menuIndex === index){

      delete cart[id];

    }

  });

  document.getElementById("qty_" + index)
    .textContent = "0";

  renderCart();

}


/* =====================================================
   THAY ĐỔI SỐ LƯỢNG
===================================================== */

function changeQty(index, amount){

  const item = menu[index];

  const size = getSelectedSize(index);

  const id = index + "|" + size;

  if(!cart[id]){

    if(amount < 0){
      return;
    }

    cart[id] = {

      menuIndex: index,

      name: item.name,

      icon: item.icon,

      size: size,

      price: item.prices[size],

      pending: item.pending === true,

      qty: 0

    };

  }


  cart[id].qty += amount;


  if(cart[id].qty <= 0){

    delete cart[id];

  }


  let qty = 0;

  Object.values(cart).forEach(itemCart => {

    if(itemCart.menuIndex === index){

      qty += itemCart.qty;

    }

  });


  document.getElementById("qty_" + index)
    .textContent = qty;


  renderCart();

}


/* =====================================================
   HIỂN THỊ GIỎ HÀNG
===================================================== */

function renderCart(){

  const root = document.getElementById("cart");

  const items = Object.values(cart);

  const totalElement =
    document.getElementById("total");

  const pendingNote =
    document.getElementById("pendingNote");


  if(items.length === 0){

    root.innerHTML = `
      <div class="cart-empty">
        Chưa có món nào được chọn.
      </div>
    `;

    totalElement.textContent = "0đ";

    pendingNote.style.display = "none";

    return;

  }


  let total = 0;

  let hasPending = false;

  root.innerHTML = "";


  items.forEach(item => {

    let rightText = "";

    if(item.pending || item.price === null){

      hasPending = true;

      rightText = `
        <div class="cart-price cart-pending">
          Quán báo giá sau
        </div>
      `;

    } else {

      const subtotal =
        item.price * item.qty;

      total += subtotal;

      rightText = `
        <div class="cart-price">
          ${money(subtotal)}
        </div>
      `;

    }


    root.innerHTML += `

      <div class="cart-item">

        <div>

          <div class="cart-name">
            ${item.icon} ${item.name} × ${item.qty}
          </div>

          <div class="cart-detail">
            ${item.size}
          </div>

        </div>

        ${rightText}

      </div>

    `;

  });


  totalElement.textContent = money(total);


  if(hasPending){

    pendingNote.style.display = "block";

  } else {

    pendingNote.style.display = "none";

  }

}


/* =====================================================
   TẠO MÃ ĐƠN
===================================================== */

function createOrderCode(){

  return String(Date.now())
    .slice(-6);

}


/* =====================================================
   GỬI ĐƠN
===================================================== */

async function submitOrder(){

  const customerName =
    document.getElementById("customerName")
    .value
    .trim();

  const phone =
    document.getElementById("phone")
    .value
    .trim();

  const className =
    document.getElementById("className")
    .value
    .trim();

  const note =
    document.getElementById("note")
    .value
    .trim();

  const items =
    Object.values(cart);


  if(!customerName){

    showResult(
      "Vui lòng nhập tên của bạn.",
      "error"
    );

    document
      .getElementById("customerName")
      .focus();

    return;

  }


  if(items.length === 0){

    showResult(
      "Vui lòng chọn ít nhất 1 món.",
      "error"
    );

    return;

  }


  let total = 0;

  let hasPending = false;


  items.forEach(item => {

    if(item.pending || item.price === null){

      hasPending = true;

    } else {

      total += item.price * item.qty;

    }

  });


  const orderCode =
    createOrderCode();


  const orderData = {

    orderCode: orderCode,

    name: customerName,

    customerName: customerName,

    phone: phone,

    className: className,

    items: items,

    note: note,

    total: total,

    hasPendingPrice: hasPending,

    pendingText:
      hasPending
        ? "Có món quán báo giá sau"
        : ""

  };


  const button =
    document.getElementById("orderButton");


  button.disabled = true;

  button.textContent =
    "ĐANG GỬI ĐƠN...";


  try{

    const response =
      await fetch(API_URL, {

        method: "POST",

        body: JSON.stringify(orderData)

      });


    const text =
      await response.text();


    let data = null;


    try{

      data = JSON.parse(text);

    }catch(e){

      data = {
        ok: response.ok
      };

    }


    if(
      data &&
      data.ok === false
    ){

      throw new Error(
        data.error ||
        "Quán chưa nhận được đơn."
      );

    }


    let successText = `
      ✅ Đặt món thành công! Mã đơn #${orderCode}<br>
      Quán đã nhận được thông tin đơn hàng.
    `;


    if(hasPending){

      successText += `
        <br><br>
        ⚠ Một số món chưa có giá. Quán sẽ báo giá sau.
      `;

    }


    showResult(
      successText,
      "success"
    );


    cart = {};


    menu.forEach((item, index) => {

      const qtyElement =
        document.getElementById("qty_" + index);

      if(qtyElement){

        qtyElement.textContent = "0";

      }

    });


    renderCart();


    document
      .getElementById("note")
      .value = "";


    document
      .getElementById("phone")
      .value = "";


    document
      .getElementById("className")
      .value = "";


  }catch(error){

    showResult(
      "❌ Chưa gửi được đơn.<br>" +
      (error.message || "Vui lòng thử lại."),
      "error"
    );

  }finally{

    button.disabled = false;

    button.textContent =
      "🛩 ĐẶT MÓN";

  }

}


/* =====================================================
   HIỂN THỊ THÔNG BÁO
===================================================== */

function showResult(message, type){

  const result =
    document.getElementById("result");

  result.className =
    "result " + type;

  result.innerHTML = message;


  result.scrollIntoView({
    behavior: "smooth",
    block: "center"
  });

}


/* =====================================================
   KHỞI CHẠY
===================================================== */

renderMenu();

renderCart();

</script>
