html = r'''<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HAMI Coffee - Đặt món</title>
<style>
:root{
  --green:#267a1f; --green2:#145f19; --ink:#243126; --muted:#6e756f;
  --cream:#fbf8ef; --card:#ffffff; --line:#e8e4d8; --soft:#eff8e9;
  --shadow:0 10px 28px rgba(83,69,37,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:radial-gradient(circle at 20% 5%,#fff 0,#fbf8ef 34%,#f6f1e4 100%);
  color:var(--ink);font-family:Arial,Helvetica,sans-serif;padding-bottom:120px
}
.wrap{max-width:980px;margin:auto;padding:18px 16px 40px}
.hero{text-align:center;padding:28px 8px 18px;position:relative}
.brand{font-size:48px;font-weight:900;letter-spacing:1px;color:var(--green);margin:0}
.brand small{display:block;font-size:19px;letter-spacing:10px;margin:4px 0 12px;color:#584d42}
.tagline{margin:0;color:#4e6951;font-size:16px}
.cart-pill{position:absolute;right:0;top:25px;background:#fff;border:1px solid var(--line);
 box-shadow:var(--shadow);border-radius:18px;padding:13px 18px;font-weight:700}
.badge{display:inline-grid;place-items:center;width:22px;height:22px;background:var(--green);
 color:#fff;border-radius:50%;font-size:12px;margin-left:5px}
.panel{background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:20px;margin:12px 0 22px}
.panel h2{font-size:20px;margin:0 0 16px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{border:1px solid #dedbd1;border-radius:18px;background:#fff;padding:10px 14px}
.field label{display:block;font-size:14px;color:#586058;margin:0 0 5px}
.field input,.field textarea{width:100%;border:0;outline:0;font-size:17px;background:transparent;color:var(--ink)}
.field textarea{height:48px;resize:none}
.tabs{display:flex;gap:10px;overflow:auto;padding:2px 0 10px;scrollbar-width:none}
.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:22px;padding:12px 18px;font-size:15px;font-weight:700;color:#424a43;cursor:pointer}
.tab.active{background:var(--green);color:#fff;border-color:var(--green)}
.menu-title{display:flex;justify-content:space-between;align-items:center;margin:18px 0 14px}
.menu-title h2{font-size:22px;margin:0;color:#28552c}
.suggest{border:1px solid #d7e7ce;background:#f8fff5;color:#4b7c43;border-radius:16px;padding:10px 14px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 7px 20px rgba(80,68,39,.08);position:relative}
.best{position:absolute;top:12px;left:12px;background:var(--green);color:#fff;padding:7px 12px;border-radius:14px;font-size:12px;font-weight:800;z-index:1}
.photo{height:190px;background:#f5f5ef;display:flex;align-items:center;justify-content:center;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.info{padding:15px}
.name{font-size:18px;font-weight:800;min-height:44px}
.price{font-size:16px;font-weight:800;color:#2d6531;margin-top:8px}
.qty-row{display:flex;align-items:center;justify-content:flex-end;gap:14px;margin-top:14px}
.qty{font-size:19px;font-weight:800;min-width:20px;text-align:center}
.circle{width:44px;height:44px;border:0;border-radius:50%;font-size:28px;cursor:pointer;background:#eef2ec;color:#6a746a}
.circle.plus{background:var(--green);color:#fff}
.unknown{background:#fffdf5;border:1px dashed #d5b979}
.unknown .info{padding-bottom:18px}
.unknown input{width:100%;border:1px solid var(--line);border-radius:13px;padding:11px;outline:none;font-size:15px;margin-top:8px}
.unknown .price{color:#9a742b;font-size:14px}
.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;width:min(948px,calc(100% - 24px));z-index:10;background:#fffdf7;border:1px solid #d9e5ce;box-shadow:0 10px 35px rgba(38,70,29,.18);border-radius:22px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.summary{font-size:14px;color:#59645b}.summary strong{display:block;font-size:24px;color:#255b29;margin-top:3px}
.checkout{border:0;background:var(--green);color:#fff;border-radius:14px;padding:16px 28px;font-size:17px;font-weight:800;cursor:pointer;min-width:240px}
.note{margin:22px 0 0;text-align:center;color:#657066}
.empty{text-align:center;color:#808780;padding:35px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-120px);transition:.35s;background:#1f6e28;color:#fff;padding:14px 22px;border-radius:15px;box-shadow:var(--shadow);z-index:30;font-weight:700}
.toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:680px){
 .wrap{padding:10px 12px 28px}.hero{padding-top:22px}.brand{font-size:40px}.cart-pill{position:static;display:inline-block;margin-top:14px}
 .form-grid{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.photo{height:155px}
 .info{padding:12px}.name{font-size:16px}.bottom{padding:10px 12px}.checkout{min-width:auto;padding:14px 16px;font-size:15px}
 .summary strong{font-size:20px}.panel{padding:16px;border-radius:20px}
}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<div class="wrap">
  <header class="hero">
    <h1 class="brand">HAMI <small>COFFEE</small></h1>
    <p class="tagline">Đặt món nhanh chóng · Phục vụ tận tâm ♥</p>
    <div class="cart-pill">🛍 Giỏ hàng <span class="badge" id="cartCount">0</span></div>
  </header>

  <section class="panel">
    <h2>♙ Thông tin khách hàng</h2>
    <div class="form-grid">
      <div class="field"><label>Tên khách hàng *</label><input id="customerName" placeholder="Nhập tên của bạn"></div>
      <div class="field"><label>Số điện thoại (không bắt buộc)</label><input id="phone" inputmode="tel" placeholder="Nhập số điện thoại"></div>
      <div class="field"><label>Số bàn / Lớp (không bắt buộc)</label><input id="table" placeholder="VD: Bàn 5 / 12A1"></div>
      <div class="field"><label>Ghi chú thêm (nếu có)</label><textarea id="note" placeholder="VD: Ít đá, không đường..."></textarea></div>
    </div>
  </section>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-cat="Tất cả">▦ Tất cả</button>
    <button class="tab" data-cat="Trà">🌿 Trà</button>
    <button class="tab" data-cat="Cà phê">☕ Cà phê</button>
    <button class="tab" data-cat="Soda">🥤 Soda</button>
    <button class="tab" data-cat="Đá xay">🍨 Đá xay</button>
    <button class="tab" data-cat="Khác">••• Khác</button>
  </nav>

  <div class="menu-title">
    <h2>🔥 MENU ĐỒ UỐNG</h2>
    <button class="suggest" type="button">☆ Gợi ý món ngon</button>
  </div>

  <main class="grid" id="menu"></main>
  <p class="note">♡ Cảm ơn bạn đã chọn HAMI Coffee!</p>
</div>

<div class="bottom">
  <div class="summary">Bạn đang có <span id="summaryCount">0</span> món<strong id="summaryTotal">0đ</strong></div>
  <button class="checkout" id="checkoutBtn">XEM GIỎ HÀNG ›</button>
</div>

<script>
// ====== CHỈ CẦN THAY MENU / LINK ẢNH TẠI ĐÂY NẾU MUỐN ======
const API_URL = "https://script.google.com/macros/s/AKfycbyFT9qfJQvIbsrBjJFlzzjcrHL-5BdTkjUVK4FaBbCuCIZmUlAdz8ofztYo5woLlz44/exec";

const products = [
 {id:"tra-dao",name:"Trà đào cam sả",price:17000,cat:"Trà",best:true,img:"https://images.unsplash.com/photo-1556679343-c7306c1976bc?auto=format&fit=crop&w=700&q=85"},
 {id:"ca-phe-sua",name:"Cà phê sữa",price:17000,cat:"Cà phê",img:"https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=700&q=85"},
 {id:"matcha",name:"Matcha Latte",price:20000,cat:"Khác",img:"https://images.unsplash.com/photo-1515823662972-da6e8f5d5e87?auto=format&fit=crop&w=700&q=85"},
 {id:"tra-sua",name:"Trà sữa trân châu",price:20000,cat:"Trà",img:"https://images.unsplash.com/photo-1525385133512-2f3bdd039054?auto=format&fit=crop&w=700&q=85"},
 {id:"sua-chua-dau",name:"Sữa chua dâu",price:20000,cat:"Khác",img:"https://images.unsplash.com/photo-1553530666-ba11a7da3888?auto=format&fit=crop&w=700&q=85"},
 {id:"tra-chanh",name:"Trà chanh",price:15000,cat:"Trà",img:"https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?auto=format&fit=crop&w=700&q=85"},
 {id:"socola",name:"Socola đá xay",price:22000,cat:"Đá xay",img:"https://images.unsplash.com/photo-1572490122747-3968b75cc699?auto=format&fit=crop&w=700&q=85"},
 {id:"soda-bac-ha",name:"Soda bạc hà",price:17000,cat:"Soda",img:"https://images.unsplash.com/photo-1544145945-f90425340c7e?auto=format&fit=crop&w=700&q=85"},
 {id:"sua-tuoi",name:"Sữa tươi trân châu",price:18000,cat:"Khác",img:"https://images.unsplash.com/photo-1551024506-0bccd828d307?auto=format&fit=crop&w=700&q=85"},
 {id:"nuoc-ngot",name:"Nước ngọt các loại",price:null,cat:"Khác",unknown:true,img:"https://images.unsplash.com/photo-1629203849820-fdd70d49c38e?auto=format&fit=crop&w=700&q=85"}
];

let cart = {};
let currentCat = "Tất cả";
const money = n => Number(n || 0).toLocaleString("vi-VN") + "đ";

function render(){
 const root=document.getElementById("menu");
 const list=products.filter(p=>currentCat==="Tất cả"||p.cat===currentCat);
 root.innerHTML=list.map(p=>`
   <article class="card ${p.unknown?'unknown':''}">
     ${p.best?'<span class="best">★ BEST</span>':''}
     <div class="photo"><img src="${p.img}" alt="${p.name}" loading="lazy"></div>
     <div class="info">
       <div class="name">${p.name}</div>
       ${p.unknown
         ? `<input id="custom-${p.id}" placeholder="Khách tự nhập tên nước ngọt">
            <div class="price">Quán sẽ báo giá sau</div>`
         : `<div class="price">${money(p.price)}</div>`}
       <div class="qty-row">
         <button class="circle" onclick="changeQty('${p.id}',-1)">−</button>
         <span class="qty">${cart[p.id]?.qty||0}</span>
         <button class="circle plus" onclick="changeQty('${p.id}',1)">+</button>
       </div>
     </div>
   </article>`).join("");
 updateSummary();
}
function changeQty(id,delta){
 const p=products.find(x=>x.id===id);
 if(!cart[id]) cart[id]={...p,qty:0,customName:""};
 if(p.unknown){
   const el=document.getElementById("custom-"+id);
   cart[id].customName=el?el.value.trim():cart[id].customName;
 }
 cart[id].qty=Math.max(0,cart[id].qty+delta);
 if(cart[id].qty===0) delete cart[id];
 render();
}
function updateSummary(){
 const items=Object.values(cart);
 const count=items.reduce((s,x)=>s+x.qty,0);
 const total=items.reduce((s,x)=>s+(x.price||0)*x.qty,0);
 document.getElementById("cartCount").textContent=count;
 document.getElementById("summaryCount").textContent=count;
 document.getElementById("summaryTotal").textContent=money(total);
 document.getElementById("checkoutBtn").textContent=count ? `XEM GIỎ HÀNG (${count}) ›` : "XEM GIỎ HÀNG ›";
}
document.getElementById("tabs").addEventListener("click",e=>{
 const b=e.target.closest(".tab"); if(!b)return;
 currentCat=b.dataset.cat;
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
 b.classList.add("active"); render();
});
function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2600)}

document.getElementById("checkoutBtn").addEventListener("click",async()=>{
 const name=document.getElementById("customerName").value.trim();
 const phone=document.getElementById("phone").value.trim();
 const table=document.getElementById("table").value.trim();
 const note=document.getElementById("note").value.trim();
 const items=Object.values(cart).filter(x=>x.qty>0);
 if(!name){showToast("Vui lòng nhập tên khách hàng");document.getElementById("customerName").focus();return}
 if(!items.length){showToast("Bạn chưa chọn món nào");return}
 for(const item of items){
   if(item.unknown && !item.customName){showToast("Vui lòng nhập tên nước ngọt");return}
 }
 const subtotal=items.reduce((s,x)=>s+(x.price||0)*x.qty,0);
 const hasPendingPrice=items.some(x=>x.price===null);
 const payload={
   name, phone, table, note,
   items:items.map(x=>({name:x.unknown?x.customName:x.name,qty:x.qty,price:x.price,subtotal:x.price===null?null:x.price*x.qty,pendingPrice:!!x.unknown})),
   subtotal, hasPendingPrice
 };
 const btn=document.getElementById("checkoutBtn");
 btn.disabled=true; btn.textContent="ĐANG GỬI...";
 try{
   const res=await fetch(API_URL,{method:"POST",body:JSON.stringify(payload)});
   const data=await res.json();
   if(data.success===false) throw new Error(data.error||"Không gửi được đơn");
   showToast("✓ Đặt món thành công! Quán đã nhận đơn.");
   cart={}; render();
 }catch(err){
   showToast("Không gửi được đơn. Vui lòng thử lại.");
   console.error(err);
 }finally{btn.disabled=false;updateSummary()}
});
render();
</script>
</body>
</html>'''
path="/mnt/data/index.html"
with open(path,"w",encoding="utf-8") as f:
    f.write(html)
print(path)
