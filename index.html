<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HAMI Coffee - Đặt món</title>

  <style>
    :root{
      --red:#d71920;
      --red-dark:#a90d14;
      --cream:#f7f1e7;
      --cream-2:#fffaf2;
      --text:#292929;
      --muted:#777;
      --line:#e6ddd0;
      --green:#658144;
      --shadow:0 12px 35px rgba(76,45,20,.10);
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(255,214,150,.28), transparent 30%),
        linear-gradient(180deg,#fffdf9 0%,var(--cream) 100%);
      color:var(--text);
    }

    button,
    input,
    textarea,
    select{
      font:inherit;
    }

    button{
      cursor:pointer;
    }

    /* =========================
       HEADER
    ========================== */

    .hero{
      background:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,.12), transparent 20%),
        radial-gradient(circle at 85% 10%, rgba(255,255,255,.10), transparent 18%),
        linear-gradient(135deg,#bd0b13,#ed2730);
      color:#fff;
      padding:38px 20px 42px;
      text-align:center;
      position:relative;
      overflow:hidden;
    }

    .hero::before,
    .hero::after{
      content:"";
      position:absolute;
      border:1px solid rgba(255,255,255,.16);
      border-radius:50%;
    }

    .hero::before{
      width:230px;
      height:230px;
      top:-145px;
      left:-80px;
    }

    .hero::after{
      width:280px;
      height:280px;
      bottom:-210px;
      right:-80px;
    }

    .brand{
      position:relative;
      z-index:1;
    }

    .logo{
      font-size:64px;
      font-weight:900;
      font-style:italic;
      letter-spacing:-4px;
      line-height:1;
    }

    .coffee{
      margin-top:9px;
      font-size:18px;
      letter-spacing:9px;
      font-weight:500;
    }

    .tagline{
      margin:22px 0 0;
      font-size:17px;
      opacity:.96;
    }

    /* =========================
       MAIN
    ========================== */

    .container{
      width:min(1120px, calc(100% - 28px));
      margin:28px auto 60px;
    }

    .section-title{
      display:flex;
      align-items:center;
      gap:10px;
      margin:10px 0 18px;
      font-size:25px;
      font-weight:800;
    }

    .section-title .star{
      color:#f6b900;
      font-size:30px;
    }

    /* =========================
       MENU
    ========================== */

    .menu-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:20px;
    }

    .drink-card{
      background:rgba(255,255,255,.88);
      border:1px solid var(--line);
      border-radius:25px;
      overflow:hidden;
      box-shadow:var(--shadow);
      transition:.2s ease;
    }

    .drink-card:hover{
      transform:translateY(-2px);
      box-shadow:0 18px 45px rgba(76,45,20,.15);
    }

    .drink-image{
      width:100%;
      height:210px;
      display:block;
      object-fit:cover;
      background:#eee;
    }

    .drink-info{
      padding:18px;
    }

    .drink-name{
      font-size:23px;
      font-weight:800;
      line-height:1.25;
      margin-bottom:8px;
    }

    .drink-price{
      color:#8e302c;
      font-size:18px;
      font-weight:800;
      min-height:24px;
    }

    .size-select{
      width:100%;
      margin-top:18px;
      padding:15px 16px;
      border:1px solid #ded5c9;
      border-radius:15px;
      background:#fffdf9;
      color:#444;
      outline:none;
      font-size:17px;
    }

    .size-select:focus{
      border-color:var(--red);
    }

    .quantity-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-top:16px;
    }

    .qty-group{
      display:flex;
      align-items:center;
      gap:13px;
    }

    .qty-btn{
      width:52px;
      height:52px;
      border:0;
      border-radius:17px;
      font-size:30px;
      line-height:1;
    }

    .qty-btn.minus{
      background:#eee9df;
      color:#5f5b55;
    }

    .qty-btn.plus{
      background:var(--green);
      color:#fff;
      box-shadow:0 7px 18px rgba(101,129,68,.28);
    }

    .qty-number{
      width:28px;
      text-align:center;
      font-size:21px;
      font-weight:800;
    }

    /* =========================
       CUSTOM SOFT DRINK
    ========================== */

    .custom-card{
      background:linear-gradient(145deg,#fff,#fff8ef);
    }

    .custom-note{
      margin-top:6px;
      color:#9a6b28;
      font-size:16px;
      font-weight:700;
    }

    .custom-input{
      width:100%;
      margin-top:16px;
      padding:15px 16px;
      border:1px solid #ded5c9;
      border-radius:15px;
      background:#fff;
      outline:none;
      font-size:17px;
    }

    .custom-input:focus{
      border-color:var(--red);
    }

    /* =========================
       ORDER BOX
    ========================== */

    .order-box{
      margin-top:28px;
      background:rgba(255,255,255,.94);
      border:1px solid var(--line);
      border-radius:28px;
      padding:24px;
      box-shadow:var(--shadow);
    }

    .order-title{
      font-size:25px;
      font-weight:900;
      margin-bottom:20px;
    }

    .summary-empty{
      color:#888;
      padding:15px 0;
    }

    .summary-list{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .summary-item{
      display:flex;
      justify-content:space-between;
      gap:15px;
      padding:12px 0;
      border-bottom:1px dashed #ddd2c3;
    }

    .summary-item:last-child{
      border-bottom:0;
    }

    .summary-name{
      font-weight:700;
      line-height:1.45;
    }

    .summary-price{
      white-space:nowrap;
      font-weight:800;
      color:#8e302c;
    }

    .total-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-top:15px;
      padding-top:18px;
      border-top:2px solid #e7ded2;
    }

    .total-label{
      font-size:22px;
      font-weight:800;
    }

    .total-price{
      font-size:30px;
      font-weight:900;
      color:#b61018;
    }

    .pending-price{
      display:none;
      margin-top:12px;
      color:#9a6b28;
      font-weight:700;
      line-height:1.5;
    }

    .pending-price.show{
      display:block;
    }

    /* =========================
       CUSTOMER FORM
    ========================== */

    .customer-form{
      margin-top:24px;
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:16px;
    }

    .field{
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .field.full{
      grid-column:1/-1;
    }

    label{
      font-size:17px;
      font-weight:800;
    }

    .required{
      color:var(--red);
    }

    input,
    textarea{
      width:100%;
      border:1px solid #ded5c9;
      background:#fffdf9;
      color:#333;
      border-radius:16px;
      padding:15px 16px;
      outline:none;
      font-size:17px;
    }

    input:focus,
    textarea:focus{
      border-color:var(--red);
      box-shadow:0 0 0 3px rgba(215,25,32,.08);
    }

    textarea{
      min-height:115px;
      resize:vertical;
    }

    /* =========================
       ORDER BUTTON
    ========================== */

    .order-button{
      width:100%;
      margin-top:24px;
      padding:20px;
      border:0;
      border-radius:18px;
      background:linear-gradient(135deg,#ef3d47,#cf1018);
      color:#fff;
      font-size:25px;
      font-weight:900;
      box-shadow:0 13px 25px rgba(207,16,24,.23);
      transition:.2s ease;
    }

    .order-button:hover{
      transform:translateY(-1px);
    }

    .order-button:disabled{
      opacity:.7;
      cursor:not-allowed;
      transform:none;
    }

    .order-hint{
      margin:16px 0 0;
      text-align:center;
      color:#777;
      line-height:1.5;
      font-size:16px;
    }

    /* =========================
       RESULT
    ========================== */

    .result{
      display:none;
      margin-top:20px;
      padding:20px;
      border-radius:20px;
      font-size:19px;
      font-weight:700;
      line-height:1.55;
    }

    .result.success{
      display:block;
      color:#355a36;
      background:#eef8ee;
      border:1px solid #b9d9bb;
    }

    .result.error{
      display:block;
      color:#8b2525;
      background:#fff0ef;
      border:1px solid #efbbb7;
    }

    .thanks{
      text-align:center;
      margin-top:42px;
      color:#777;
      font-size:20px;
    }

    /* =========================
       MOBILE
    ========================== */

    @media(max-width:700px){

      .hero{
        padding:32px 15px 35px;
      }

      .logo{
        font-size:53px;
      }

      .coffee{
        font-size:15px;
        letter-spacing:7px;
      }

      .tagline{
        font-size:16px;
      }

      .container{
        width:min(100% - 22px,1120px);
        margin-top:22px;
      }

      .section-title{
        font-size:24px;
      }

      .menu-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:12px;
      }

      .drink-card{
        border-radius:20px;
      }

      .drink-image{
        height:145px;
      }

      .drink-info{
        padding:14px;
      }

      .drink-name{
        font-size:19px;
      }

      .drink-price{
        font-size:16px;
      }

      .size-select,
      .custom-input{
        padding:13px 12px;
        font-size:15px;
      }

      .quantity-row{
        margin-top:13px;
      }

      .qty-group{
        gap:8px;
      }

      .qty-btn{
        width:44px;
        height:44px;
        border-radius:14px;
        font-size:25px;
      }

      .qty-number{
        font-size:18px;
      }

      .order-box{
        border-radius:22px;
        padding:18px;
      }

      .customer-form{
        grid-template-columns:1fr;
      }

      .field.full{
        grid-column:auto;
      }

      .order-button{
        font-size:22px;
      }

      .total-price{
        font-size:26px;
      }
    }

    @media(max-width:380px){
      .menu-grid{
        grid-template-columns:1fr;
      }

      .drink-image{
        height:190px;
      }
    }
  </style>
</head>

       HEADER

  <header class="hero">
    <div class="brand">
      <div class="logo">HAMI</div>

  </header>


  <main class="container">

      <span class="star">★</span>

    ========================== -->

         ORDER
    ========================== -->

    <section class="order-box">

      <div id="orderSummary">
        <div class="summary-empty">
          Bạn chưa chọn món nào.
        </div>
      </div>

      <div class="total-row">
        <div class="total-label">Tổng tạm tính</div>
        <div class="total-price" id="totalPrice">0đ</div>
      </div>

      <div class="pending-price" id="pendingPrice">
        ⚠ Có món chưa báo giá. Quán sẽ báo giá sau.
      </div>


      <!-- FORM -->

      <div class="customer-form">

        <div class="field full">
          <label>
            Tên của bạn <span class="required">*</span>
          </label>
          <input
            type="text"
            id="customerName"
            placeholder="Nhập tên của bạn"
            autocomplete="name"
          >
        </div>

        <div class="field">
          <label>Số điện thoại (không bắt buộc)</label>
          <input
            type="tel"
            id="customerPhone"
            placeholder="Nhập số điện thoại"
            autocomplete="tel"
          >
        </div>

        <div class="field">
          <label>Lớp / Số bàn (không bắt buộc)</label>
          <input
            type="text"
            id="customerClass"
            placeholder="Nhập lớp hoặc số bàn"
          >
        </div>

        <div class="field full">
          <label>Ghi chú cho quán</label>
          <textarea
            id="customerNote"
            placeholder="Ví dụ: ít đá, ít ngọt..."
          ></textarea>
        </div>

      </div>


      <button class="order-button" id="orderButton">
        ✈ ĐẶT MÓN
      </button>

      <p class="order-hint">
        Đơn hàng sẽ được gửi trực tiếp về quán.
      </p>


      <div id="resultBox"></div>

    </section>


    <div class="thanks">
      ❤️ Cảm ơn bạn đã chọn HAMI Coffee
    </div>

  </main>

    /* =========================================================

    const cart = {};

    const menuGrid = document.getElementById("menuGrid");
    const orderSummary = document.getElementById("orderSummary");

    const pendingPrice = document.getElementById("pendingPrice");
    const resultBox = document.getElementById("resultBox");

    /* =========================================================
       FORMAT MONEY
    ========================================================= */

    function formatMoney(number){

      if(number === null || number === undefined){
        return "Quán báo giá sau";
      }

      return new Intl.NumberFormat("vi-VN").format(number) + "đ";
    }


    /* =========================================================
       RENDER MENU
    ========================================================= */

    function renderMenu(){

      menuGrid.innerHTML = MENU.map(item => {

        const options = item.sizes.map((option,index) => {

          if(option.price === null){
            return `
              <option value="${index}">
                ${option.size}
              </option>
            `;
          }

          const label =
            option.size
              ? `${option.size} - ${formatMoney(option.price)}`
              : formatMoney(option.price);

          return `
            <option value="${index}">
              ${label}
            </option>
          `;

        }).join("");


        const firstPrice = item.sizes[0].price;

        const priceText = item.custom
          ? "Giá quán báo sau"
          : item.sizes
              .map(option => {
                const label = option.size ? option.size + ": " : "";
                return label + formatMoney(option.price);
              })
              .join(" · ");


        const customInput = item.custom
          ? `
            <input
              type="text"
              class="custom-input"
              id="customName_${item.id}"
              placeholder="Ví dụ: Coca, Pepsi, 7Up..."
              oninput="updateCustomName('${item.id}')"
            >
          `
          : "";


        return `

          <article class="drink-card ${item.custom ? "custom-card" : ""}">

            <img
              class="drink-image"
              src="${item.image}"
              alt="${item.name}"
              loading="lazy"
              onerror="this.style.display='none'"
            >

            <div class="drink-info">

              <div class="drink-name">
                ${item.name}
              </div>

              <div class="drink-price">
                ${priceText}
              </div>

              ${item.custom
                ? `<div class="custom-note">Quán sẽ báo giá sau</div>`
                : ""
              }

              ${customInput}

              <select
                class="size-select"
                id="size_${item.id}"
                onchange="changeSize('${item.id}')"
              >
                ${options}
              </select>


              <div class="quantity-row">

                <div class="qty-group">

                  <button
                    class="qty-btn minus"
                    onclick="changeQty('${item.id}', -1)"
                    type="button"
                  >
                    −
                  </button>

                  <div
                    class="qty-number"
                    id="qty_${item.id}"
                  >
                    0
                  </div>

                  <button
                    class="qty-btn plus"
                    onclick="changeQty('${item.id}', 1)"
                    type="button"
                  >
                    +
                  </button>

                </div>

              </div>

            </div>

          </article>

        `;

      }).join("");
    }


    /* =========================================================
       CHANGE SIZE
    ========================================================= */

    function changeSize(id){

      if(!cart[id]){
        return;
      }

      const select = document.getElementById("size_" + id);

      cart[id].sizeIndex = Number(select.value);

      renderOrder();

    }


    /* =========================================================
       CUSTOM DRINK NAME
    ========================================================= */

    function updateCustomName(id){

      const input = document.getElementById("customName_" + id);

      if(cart[id]){
        cart[id].customName = input.value.trim();
      }

      renderOrder();

    }


    /* =========================================================
       CHANGE QUANTITY
    ========================================================= */

    function changeQty(id, change){

      const item = MENU.find(item => item.id === id);

      if(!item){
        return;
      }

      if(!cart[id]){

        cart[id] = {
          qty: 0,
          sizeIndex: 0,
          customName: ""
        };

      }


      cart[id].qty += change;


      if(cart[id].qty <= 0){
        delete cart[id];
      }


      const qtyElement = document.getElementById("qty_" + id);

      qtyElement.textContent = cart[id] ? cart[id].qty : 0;


      renderOrder();

    }


    /* =========================================================
       GET CART ITEMS
    ========================================================= */

    function getCartItems(){

      const items = [];

      for(const id in cart){

        const menuItem = MENU.find(item => item.id === id);

        if(!menuItem){
          continue;
        }

        const cartItem = cart[id];

        const selectedOption =
          menuItem.sizes[cartItem.sizeIndex || 0];


        let itemName = menuItem.name;


        if(menuItem.custom){

          const customInput =
            document.getElementById("customName_" + id);

          const customName =
            customInput
              ? customInput.value.trim()
              : cartItem.customName || "";

          if(customName){
            itemName += ": " + customName;
          }

        }


        items.push({
          id: id,
          name: itemName,
          originalName: menuItem.name,
          customName: menuItem.custom
            ? (
                document.getElementById("customName_" + id)?.value.trim()
                || ""
              )
            : "",
          qty: cartItem.qty,
          size: selectedOption.size || "",
          price: selectedOption.price
        });

      }

      return items;

    }


    /* =========================================================
       RENDER ORDER
    ========================================================= */

    function renderOrder(){

      const items = getCartItems();


      if(items.length === 0){

        orderSummary.innerHTML = `
          <div class="summary-empty">
            Bạn chưa chọn món nào.
          </div>
        `;

        totalPrice.textContent = "0đ";

        pendingPrice.classList.remove("show");

        return;

      }


      let total = 0;
      let hasPendingPrice = false;


      orderSummary.innerHTML = `

        <div class="summary-list">

          ${items.map(item => {

            let priceText = "";

            if(item.price === null){

              hasPendingPrice = true;

              priceText = "Quán báo giá sau";

            }else{

              const subtotal =
                item.price * item.qty;

              total += subtotal;

              priceText = formatMoney(subtotal);

            }


            const sizeText =
              item.size &&
              item.size !== "Quán báo giá sau"
                ? ` (${item.size})`
                : "";


            return `

              <div class="summary-item">

                <div class="summary-name">
                  ${item.name}${sizeText} × ${item.qty}
                </div>

                <div class="summary-price">
                  ${priceText}
                </div>

              </div>

            `;

          }).join("")}

        </div>

      `;


      totalPrice.textContent = formatMoney(total);


      if(hasPendingPrice){
        pendingPrice.classList.add("show");
      }else{
        pendingPrice.classList.remove("show");
      }

    }


    /* =========================================================
       SEND ORDER
    ========================================================= */

    orderButton.addEventListener("click", async function(){

      resultBox.className = "";
      resultBox.innerHTML = "";


      const name =
        document
          .getElementById("customerName")
          .value
          .trim();

      const phone =
        document
          .getElementById("customerPhone")
          .value
          .trim();

      const className =
        document
          .getElementById("customerClass")
          .value
          .trim();

      const note =
        document
          .getElementById("customerNote")
          .value
          .trim();


      const items = getCartItems();


      if(!name){

        showError(
          "Vui lòng nhập tên của bạn."
        );

        document
          .getElementById("customerName")
          .focus();

        return;

      }


      if(items.length === 0){

        showError(
          "Vui lòng chọn ít nhất một món."
        );

        return;

      }


      /* KIỂM TRA NƯỚC NGỌT */

      const invalidCustomDrink =
        items.find(item =>
          item.id === "nuoc_ngot" &&
          !item.customName
        );


      if(invalidCustomDrink){

        showError(
          "Bạn chưa nhập tên loại nước ngọt."
        );

        document
          .getElementById("customName_nuoc_ngot")
          .focus();

        return;

      }


      let total = 0;
      let hasPendingPrice = false;


      items.forEach(item => {

        if(item.price === null){

          hasPendingPrice = true;

        }else{

          total += item.price * item.qty;

        }

      });


      const payload = {

        name: name,

        phone: phone,

        className: className,

        items: items,

        note: note,

        total: total,

        hasPendingPrice: hasPendingPrice

      };


      orderButton.disabled = true;

      orderButton.innerHTML =
        "ĐANG GỬI ĐƠN...";


      try{

        const response = await fetch(API_URL, {

          method: "POST",

          body: JSON.stringify(payload),

          redirect: "follow"

        });


        let data = null;


        try{

          const text =
            await response.text();

          data =
            text
              ? JSON.parse(text)
              : null;

        }catch(error){

          /* Apps Script có thể không trả JSON */

        }


        if(
          data &&
          data.ok === false
        ){

          throw new Error(
            data.error ||
            "Không thể gửi đơn."
          );

        }


        const orderNo =
          data?.orderNo ||
          data?.orderNumber ||
          "";


        showSuccess(

          `Đặt món thành công${
            orderNo
              ? "! Mã đơn #" + orderNo
              : "!"
          }<br>Quán đã nhận được thông tin đơn hàng.${
            hasPendingPrice
              ? "<br><br>⚠ Một số món chưa có giá. Quán sẽ báo giá sau."
              : ""
          }`

        );


        clearOrder();


      }catch(error){

        console.error(error);


        showError(
          "Không gửi được đơn. Vui lòng thử lại."
        );

      }finally{

        orderButton.disabled = false;

        orderButton.innerHTML =
          "✈ ĐẶT MÓN";

      }

    });


    /* =========================================================
       SUCCESS / ERROR
    ========================================================= */

    function showSuccess(message){

      resultBox.className =
        "result success";

      resultBox.innerHTML =
        "✅ " + message;

    }


    function showError(message){

      resultBox.className =
        "result error";

      resultBox.innerHTML =
        "❌ " + message;

    }


    /* =========================================================
       CLEAR ORDER
    ========================================================= */

    function clearOrder(){

      for(const id in cart){

        delete cart[id];

      }


      MENU.forEach(item => {

        const qty =
          document.getElementById("qty_" + item.id);

        if(qty){
          qty.textContent = "0";
        }


        const size =
          document.getElementById("size_" + item.id);

        if(size){
          size.selectedIndex = 0;
        }


        if(item.custom){

          const customInput =
            document.getElementById(
              "customName_" + item.id
            );

          if(customInput){
            customInput.value = "";
          }

        }

      });


      document
        .getElementById("customerName")
        .value = "";

      document
        .getElementById("customerPhone")
        .value = "";

      document
        .getElementById("customerClass")
        .value = "";

      document
        .getElementById("customerNote")
        .value = "";


      renderOrder();

    }


    /* =========================================================
       START
    ========================================================= */

    renderMenu();

    renderOrder();

  </script>

</body>
</html>
